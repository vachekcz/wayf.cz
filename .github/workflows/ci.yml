# Adapted from dev-template/github-ci (bundle 2026-09-02).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PREVIEW_HOST_SUFFIX: wayf-cz.pvpvpv.workers.dev

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - run: npm run check
      - run: npm run build
      - run: npm run deploy:check
      - name: Verify static assets in Workers runtime
        run: |
          npm run preview -- --ip 127.0.0.1 --port 8787 > /tmp/wayf-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          npm run smoke || { cat /tmp/wayf-preview.log; exit 1; }
      - name: Save verified site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/
          if-no-files-found: error
          retention-days: 3

  ci-passed:
    name: CI Passed
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          if [[ "$CHECKS_RESULT" != 'success' ]]; then
            echo "::error::Required checks did not succeed: $CHECKS_RESULT"
            exit 1
          fi

  # Same-repository PRs get an aliased version of the existing Worker.
  # Uploading a version does not change the production deployment.
  # Preview and Lighthouse are informative, matching dotidot-com.
  preview:
    name: Preview deploy
    needs: checks
    if: >-
      !cancelled() && needs.checks.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.url.outputs.url }}
    outputs:
      url: ${{ steps.url.outputs.url }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Preview URL
        id: url
        run: echo "url=https://pr-${PR_NUMBER}-${PREVIEW_HOST_SUFFIX}" >> "$GITHUB_OUTPUT"
      - name: Mark the review app as updating
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.url.outputs.url }}
          PREVIEW_RESULT: pending
          LIGHTHOUSE_RESULT: pending
        run: |
          node scripts/ci/preview-comment.mjs
          bash scripts/ci/pr-comment.sh "$PR_NUMBER" comment.md
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist/
      - name: Upload verified site as a preview version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing preview configuration: $name"
              exit 1
            fi
          done
          npm run deploy:preview -- --preview-alias "pr-${PR_NUMBER}" --tag "pr-${PR_NUMBER}" --message "$GITHUB_SHA"
      - name: Verify preview content and noindex
        run: npm run smoke
        env:
          DEPLOY_URL: ${{ steps.url.outputs.url }}
      - name: Post the verified preview link
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.url.outputs.url }}
          PREVIEW_RESULT: success
          LIGHTHOUSE_RESULT: pending
        run: |
          node scripts/ci/preview-comment.mjs
          bash scripts/ci/pr-comment.sh "$PR_NUMBER" comment.md

  lighthouse:
    name: Lighthouse
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_URL: ${{ needs.preview.outputs.url }}
    outputs:
      artifact-url: ${{ steps.artifact.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Measure the preview
        id: measure
        continue-on-error: true
        run: npm run lighthouse
      - name: Summarize Lighthouse scores
        id: summary
        continue-on-error: true
        run: node scripts/ci/lighthouse-summary.mjs
      - name: Save Lighthouse reports
        id: artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: |
            reports/lighthouse/
            reports/lighthouse-summary.md
          if-no-files-found: error
          retention-days: 14
      - name: Require a complete measurement
        if: steps.measure.outcome != 'success' || steps.summary.outcome != 'success'
        run: |
          echo '::error::Lighthouse did not produce a complete measurement. See preceding steps.'
          exit 1

  preview-report:
    name: PR preview report
    needs: [preview, lighthouse]
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        if: needs.lighthouse.result != 'skipped'
        continue-on-error: true
        with:
          name: lighthouse
          path: reports/
      - name: Update the PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ needs.preview.outputs.url }}
          PREVIEW_RESULT: ${{ needs.preview.result }}
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse.result }}
          ARTIFACT_URL: ${{ needs.lighthouse.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/ci/preview-comment.mjs
          bash scripts/ci/pr-comment.sh "$PR_NUMBER" comment.md

  deploy:
    name: Deploy (Cloudflare)
    needs: ci-passed
    if: >-
      !cancelled() && needs.ci-passed.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist/
      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DEPLOY_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing production configuration: $name"
              exit 1
            fi
          done
      - name: Deploy verified site
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify deployed site
        run: npm run smoke
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
